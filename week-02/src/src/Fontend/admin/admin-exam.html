<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo đề thi TSA - Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>ADMIN <span class="text-red">TSA</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-list.html" class="nav-item"><i class="fa-solid fa-list-check"></i> Quản lý đề thi</a>
                <a href="admin-exam.html" class="nav-item active"><i class="fa-solid fa-file-pen"></i> Tạo đề thi TSA</a>
                <a href="admin-list-course.html" class="nav-item"><i class="fa-solid fa-layer-group"></i> Quản lý khóa học</a>
                <a href="admin-course.html" class="nav-item"><i class="fa-solid fa-book-open"></i> Tạo khóa học</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-action">
                <h1 class="page-title">Tạo Đề Thi Đánh Giá Tư Duy</h1>
            </div>
            
            <div style="background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
                <strong><i class="fa-solid fa-lightbulb" style="color: #f59e0b;"></i> Mẹo:</strong> Hệ thống hỗ trợ gõ công thức Toán học bằng LaTeX. Đặt công thức trong cặp dấu <code>\\(...\\)</code> để hiển thị trên cùng dòng, hoặc <code>$$...$$</code> để hiển thị ở dòng riêng.
            </div>

            <!-- Exam Info Card -->
            <div class="card">
                <h3 class="card-title"><i class="fa-solid fa-gear"></i> Thông tin đề thi</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="font-semibold">Mã đề thi</label>
                        <input type="text" id="exam-code" placeholder="VD: TSA2024_01">
                    </div>
                    <div class="form-group">
                        <label class="font-semibold">Tên đề thi</label>
                        <input type="text" id="exam-name" placeholder="VD: Đề thi thử TSA tháng 10">
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="ToanHoc" data-max="40">Toán Học <span class="counter">(0/40)</span></button>
                <button class="tab-btn" data-tab="DocHieu" data-max="20">Đọc Hiểu <span class="counter">(0/20)</span></button>
                <button class="tab-btn" data-tab="KhoaHoc" data-max="40">Khoa Học <span class="counter">(0/40)</span></button>
            </div>

            <div class="tab-content active" id="tab-ToanHoc" data-section="ToanHoc">
                <div class="passages-container"></div>
                <div class="add-btn-wrapper">
                    <button type="button" class="btn-outline btn-add-passage"><i class="fa-solid fa-plus"></i> Thêm Cụm Câu Hỏi</button>
                </div>
            </div>

            <div class="tab-content" id="tab-DocHieu" data-section="DocHieu">
                <div class="passages-container"></div>
                <div class="add-btn-wrapper">
                    <button type="button" class="btn-outline btn-add-passage"><i class="fa-solid fa-plus"></i> Thêm Cụm Câu Hỏi</button>
                </div>
            </div>

            <div class="tab-content" id="tab-KhoaHoc" data-section="KhoaHoc">
                <div class="passages-container"></div>
                <div class="add-btn-wrapper">
                    <button type="button" class="btn-outline btn-add-passage"><i class="fa-solid fa-plus"></i> Thêm Cụm Câu Hỏi</button>
                </div>
            </div>

            <!-- Save Button -->
            <div class="footer-action">
                <button type="button" class="btn-primary btn-lg" id="btn-save-exam">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu Đề Thi
                </button>
            </div>
        </main>
    </div>

    <!-- Templates (Hidden from UI, cloned via JS) -->
    <template id="tpl-passage">
        <div class="passage-card accordion">
            <div class="passage-header">
                <span class="passage-name font-semibold text-red">Cụm Câu Hỏi</span>
                <div class="passage-actions">
                    <button type="button" class="btn-icon toggle-passage" title="Thu gọn/Mở rộng"><i class="fa-solid fa-chevron-down"></i></button>
                    <button type="button" class="btn-icon text-red delete-passage" title="Xóa cụm câu hỏi"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <div class="passage-body split-screen">
                <!-- Cột trái: Ngữ liệu -->
                <div class="passage-left">
                    <div class="form-group">
                        <label class="font-semibold"><i class="fa-solid fa-align-left"></i> Ngữ liệu (Đoạn văn/Mô tả)</label>
                        <!-- Rich Text Toolbar giả lập -->
                        <div class="rich-text-toolbar">
                            <i class="fa-solid fa-bold" title="In đậm"></i>
                            <i class="fa-solid fa-italic" title="In nghiêng"></i>
                            <i class="fa-solid fa-underline" title="Gạch chân"></i>
                            <i class="fa-solid fa-list-ul" title="Danh sách"></i>
                        </div>
                        <textarea class="passage-context rich-textarea" rows="10" placeholder="Nhập ngữ liệu cho cụm câu hỏi..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="font-semibold"><i class="fa-regular fa-image"></i> Hình ảnh đính kèm (nếu có)</label>
                        <div class="file-upload-wrapper">
                            <input type="file" class="passage-file" accept="image/*">
                        </div>
                    </div>
                </div>
                
                <!-- Cột phải: Câu hỏi -->
                <div class="passage-right">
                    <div class="questions-header">
                        <label class="font-semibold"><i class="fa-solid fa-clipboard-question"></i> Danh sách câu hỏi</label>
                    </div>
                    <div class="questions-container"></div>
                    
                    <button type="button" class="btn-secondary btn-add-question"><i class="fa-solid fa-plus"></i> Thêm Câu Hỏi</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-question">
        <div class="question-card">
            <div class="question-header">
                <span class="question-idx font-semibold text-red">Câu hỏi</span>
                <button type="button" class="btn-icon text-red delete-question" title="Xóa câu hỏi"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="question-body">
                <div class="form-group">
                    <label class="font-semibold">Nội dung câu hỏi (Kèm LaTeX)</label>
                    <textarea class="q-content math-input" rows="2" placeholder="Nhập nội dung câu hỏi..."></textarea>
                    
                    <label class="font-semibold" style="margin-top: 10px; font-size: 13px; color: #555;"><i class="fa-regular fa-image"></i> Ảnh đính kèm (nếu có)</label>
                    <input type="file" accept="image/*" class="question-image-upload" style="font-size: 13px;">
                    <img class="question-image-preview" src="" style="display: none; max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 6px; border: 1px solid #ddd;">
                </div>
                <div class="form-group">
                    <label class="font-semibold">Dạng câu hỏi</label>
                    <select class="q-type">
                        <option value="1">1 Lựa chọn (1 đáp án đúng)</option>
                        <option value="2">Nhiều lựa chọn (Nhiều đáp án đúng)</option>
                        <option value="3">Đúng / Sai</option>
                        <option value="4">Trả lời ngắn</option>
                        <option value="5">Kéo thả điền khuyết</option>
                    </select>
                </div>
                <!-- Vùng chứa các lựa chọn đáp án tương ứng với từng loại câu hỏi -->
                <div class="q-answers-wrapper"></div>
            </div>
        </div>
    </template>

    <script src="admin-exam.js"></script>
</body>
</html>
