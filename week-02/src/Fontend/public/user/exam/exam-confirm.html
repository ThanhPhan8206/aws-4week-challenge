<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận thông tin dự thi - DOLEARN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #cc0000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #fff0f5; /* Nền hồng nhạt */
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="1" fill="%23ffcccc"/></svg>');
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .confirm-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .confirm-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .confirm-header h1 {
            color: var(--primary-red);
            font-size: 36px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .confirm-header h1 span {
            font-size: 11px;
            color: #333;
            font-weight: 600;
            text-align: left;
            line-height: 1.2;
            letter-spacing: 0.5px;
        }
        .confirm-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: #111;
            margin-top: 10px;
        }

        .info-list {
            margin-bottom: 24px;
            padding: 0 10px;
        }
        .info-item {
            display: flex;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-item i {
            width: 20px;
            color: #666;
            margin-top: 3px;
        }
        .info-label {
            color: #666;
            width: 130px;
        }
        .info-value {
            font-weight: 600;
            color: #111;
            flex: 1;
        }

        .note-text {
            font-size: 13px;
            font-style: italic;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .btn-start {
            width: 100%;
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn-start:hover {
            background: #a30000;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }
        .footer-links a {
            color: var(--primary-red);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .footer-links a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="confirm-box">
        <div class="confirm-header">
            <h1>TSA <span>ĐẠI HỌC BÁCH KHOA HÀ NỘI<br>KỲ THI ĐÁNH GIÁ TƯ DUY</span></h1>
            <h2>Xác nhận thông tin dự thi</h2>
        </div>

        <div class="info-list">
            <div class="info-item">
                <i class="fa-regular fa-user"></i>
                <span class="info-label">Họ tên</span>
                <span class="info-value" id="c-name">Đang tải...</span>
            </div>
            <div class="info-item">
                <i class="fa-regular fa-file-lines"></i>
                <span class="info-label">Kíp thi</span>
                <span class="info-value" id="c-exam">Đang tải...</span>
            </div>
            <div class="info-item">
                <i class="fa-regular fa-clock"></i>
                <span class="info-label">Thời gian làm bài</span>
                <span class="info-value" id="c-time">-- phút</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-list-ol"></i>
                <span class="info-label">Số lượng câu hỏi</span>
                <span class="info-value" id="c-count">-- câu</span>
            </div>
        </div>

        <div class="note-text">
            Lưu ý: Bằng việc nhấn nút <strong>"Bắt đầu thi"</strong> hệ thống sẽ bắt đầu tính giờ cho bài thi của bạn
        </div>

        <button class="btn-start" id="btn-proceed">
            <i class="fa-regular fa-circle-play"></i> Bắt đầu thi
        </button>

        <div class="footer-links">
            <a href="/user/exam/exam-list.html"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
            <a href="#"><i class="fa-regular fa-circle-question"></i> Hướng dẫn</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lấy thông tin User
            const savedUser = localStorage.getItem('user_info');
            if (savedUser) {
                try { 
                    const user = JSON.parse(savedUser); 
                    document.getElementById('c-name').textContent = user.hoTen || 'Người dùng';
                } catch(e) {}
            }

            const examId = localStorage.getItem('currentExamId');
            if (!examId) {
                window.location.href = '/user/exam/exam-list.html';
                return;
            }

            fetch(`/api/exams/${examId}`)
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        const examData = result.data;
                        document.getElementById('c-exam').textContent = examData.TenDeThi;
                        try {
                            const parsed = JSON.parse(examData.NoiDungJSON);
                            const qCount = parsed.questions ? parsed.questions.length : (examData.questions || 40);
                            const time = examData.time || 60;
                            document.getElementById('c-time').textContent = time + ' phút';
                            document.getElementById('c-count').textContent = qCount + ' câu';
                        } catch(e) {
                            document.getElementById('c-time').textContent = '60 phút';
                            document.getElementById('c-count').textContent = '40 câu';
                        }
                    }
                })
                .catch(err => {
                    document.getElementById('c-exam').textContent = 'BMC 06_TƯ DUY TOÁN HỌC';
                    document.getElementById('c-time').textContent = '60 phút';
                    document.getElementById('c-count').textContent = '40 câu';
                });

            document.getElementById('btn-proceed').addEventListener('click', () => {
                window.location.href = '/user/exam/exam-take.html';
            });
        });
    </script>
</body>
</html>
